
image: python:3.12

stages:
  - build
  - test

build_job:
  stage: build
  script:
    - python -m py_compile calculator.py test_calculator.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

test_job:
  stage: test
  script:
    - python -m pip install pytest
    - python -m pytest -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
